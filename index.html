/* ===== GTT별 "이미 GTT 정의에 포함된" EPC — 이중계상 방지로 선택 불가 처리 =====
   Williams(1988)의 GTT 정의문에 담긴 조건과 의미가 겹치는 EPC입니다. 프로그램의 해석이므로 필요하면 이 표만 고치면 됩니다. */
const GTT_OVERLAP={
  A:{epc:[1,2,12,15],why:'"완전히 생소한 작업을 결과를 모른 채 서둘러 수행" — 낯선 상황(1)·시간 부족(2)·위험 인식 불일치(12)·경험 부족(15)이 정의에 이미 들어 있음'},
  B:{epc:[16,17],why:'"절차·감독 없이 한 번에 변경·복구" — 절차 품질(16)과 독립 점검 부재(17)가 정의에 이미 들어 있음'},
  C:{epc:[],why:'"높은 판단력·숙련이 필요한 복잡한 작업" — 복잡함 자체는 정의에 들어 있지만, 교육 수준 불일치(20)·능력을 넘는 판단(24)은 작업자와 과제가 어긋날 때 따로 생기는 조건이라 선택할 수 있음'},
  D:{epc:[2],why:'"단순한 작업을 서두르거나 소홀히 수행" — 시간 부족(2)이 정의의 "서두름"에 이미 들어 있음. 심신 활동 기회 부족(22)은 소홀함의 원인일 수 있어 별도로 선택 가능'},

Object.entries(KWS).forEach(([no,str])=>str.split(',').forEach(raw=>{
  const strong=raw.endsWith('!'),w=raw.replace(/!$/,'').trim();if(!w)return;
  const pat=[...w.replace(/\s+/g,'')].map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s*');
  KW.push({no:+no,w,wt:strong?3:2,re:new RegExp(pat,'g')});}));

/* ===== 계산 ===== */
const ovSet=g=>new Set((GTT_OVERLAP[g]||{epc:[]}).epc);
const fac=(mx,a)=>(mx-1)*a+1;
/* GTT 기준 오류확률의 5~95 백분위 범위 (KOSHA GUIDE X-74-2017 표 1 / Williams 1988) — 불확실성 범위 계산용 */
const GTT_BOUND={A:[.35,.97],B:[.14,.42],C:[.12,.28],D:[.06,.13],E:[.007,.045],F:[.0008,.009],G:[.00008,.009],H:[.000006,.00009],M:[.008,.11]};
function calc(st){
  const g=GTT[st.gtt],blk=ovSet(st.gtt),terms=[];
  Object.entries(st.epc).forEach(([n,a])=>{n=+n;if(typeof a!=='number'||blk.has(n))return;const mx=EPC[n][1];terms.push({no:n,name:EPC[n][0],max:mx,apoa:a,f:fac(mx,a)});});
  terms.sort((x,y)=>y.f-x.f);
  const nhep=g?g.v:null,prod=terms.reduce((p,t)=>p*t.f,1);
  const raw=nhep==null?null:nhep*prod,hep=raw==null?null:Math.min(1,raw);
  const pend=Object.entries(st.epc).filter(([n,a])=>typeof a!=='number').length;
  const bd=GTT_BOUND[st.gtt],lo=bd?Math.min(1,bd[0]*prod):null,hi=bd?Math.min(1,bd[1]*prod):null;
  return {nhep,terms,prod,hep,lo,hi,capped:raw!=null&&raw>1,pend};
}
const fmt=p=>p==null?'—':p>=0.1?p.toFixed(3):p>=0.01?p.toFixed(4):p>=0.001?p.toFixed(5):p.toPrecision(2);
const pct=p=>p==null?'—':(p*100>=10?(p*100).toFixed(1):p*100>=1?(p*100).toFixed(2):(p*100).toPrecision(2))+'%';
function taskRange(){const rs=S.steps.map(calc);if(!rs.length||rs.some(r=>r.hep==null))return null;return [1-rs.reduce((p,r)=>p*(1-r.lo),1),1-rs.reduce((p,r)=>p*(1-r.hi),1)];}
const rng=r=>r&&r.lo!=null?`5~95 백분위 범위 ${fmt(r.lo)} ~ ${fmt(r.hi)}`:'';
function taskHep(){const rs=S.steps.map(calc);if(rs.some(r=>r.hep==null))return null;return 1-rs.reduce((p,r)=>p*(1-r.hep),1);}

function excludedHits(st){const blk=ovSet(st.gtt);if(!blk.size)return [];const text=((st.name||'')+' \n'+(st.desc||''));const hit=new Set();KW.forEach(k=>{if(blk.has(k.no)){k.re.lastIndex=0;if(k.re.test(text))hit.add(k.no);}});return [...hit].sort((a,b)=>a-b);}
function analyze(st){
  const text=((st.name||'')+' \n'+(st.desc||'')),blk=ovSet(st.gtt),sc={};
  KW.forEach(k=>{k.re.lastIndex=0;if(k.re.test(text)){const o=sc[k.no]||(sc[k.no]={no:k.no,score:0,words:[]});
    if(!o.words.includes(k.w)){o.words.push(k.w);o.score+=k.wt;}}});
  const all=Object.values(sc).filter(o=>!blk.has(o.no));
  all.forEach(o=>{o.score+=Math.min(1.5,EPC[o.no][1]/12);});   // 동점일 때는 영향 배수가 큰 조건을 앞에
  all.sort((a,b)=>b.score-a.score);
  return all;
}
function hilite(text){
  let spans=[];KW.forEach(k=>{k.re.lastIndex=0;let m;while((m=k.re.exec(text))){spans.push([m.index,m.index+m[0].length]);if(m[0].length===0)k.re.lastIndex++;}});
  spans.sort((a,b)=>a[0]-b[0]);const mg=[];spans.forEach(s=>{const l=mg[mg.length-1];if(l&&s[0]<=l[1])l[1]=Math.max(l[1],s[1]);else mg.push(s.slice());});
  let h='',p=0;mg.forEach(([a,b])=>{h+=esc(text.slice(p,a))+'<mark class="kw">'+esc(text.slice(a,b))+'<\/mark>';p=b;});return h+esc(text.slice(p));
}

/* ---------- 화면 맨 위 고정 메뉴 (CSS sticky가 막히는 스킨에서도 동작하도록 직접 처리) ---------- */
function stick(force){
  const app=$('#heartApp'),stk=$('#stk'),sp=$('#stkSpacer');if(!app||!stk)return;
  if(force&&stk.classList.contains('fx')){stk.classList.remove('fx','cpt');stk.style.cssText='';sp.style.height='0';}
  const ar=app.getBoundingClientRect();document.querySelectorAll('#v-ov,#v-st,#v-rp').forEach(e=>e.classList.toggle('nw',ar.width<900));const h=stk.offsetHeight;

    if(!stk.classList.contains('fx')){sp.style.height=h+'px';stk.classList.add('fx','cpt');}
    stk.style.left=ar.left+'px';stk.style.width=ar.width+'px';stk.style.top=TOP_OFF+'px';
  }else if(stk.classList.contains('fx')){stk.classList.remove('fx','cpt');stk.style.cssText='';sp.style.height='0';}

function burst(x,y,n){

  for(let i=0;i<(n||30);i++){const e=document.createElement('i');e.className='cf';const s=6+Math.random()*7;
    e.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s*(Math.random()>.5?1:.45)}px;background:${cols[i%cols.length]};border-radius:${Math.random()>.6?'50%':'2px'}`;app.appendChild(e);
    const a=Math.random()*Math.PI*2,v=90+Math.random()*190,dx=Math.cos(a)*v,dy=Math.sin(a)*v-120;
    e.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*540}deg)`,opacity:1,offset:.55},{transform:`translate(${dx*1.15}px,${dy+260}px) rotate(${Math.random()*900}deg)`,opacity:0}],{duration:1100+Math.random()*500,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>e.remove();}
}
function countUp(el,to){

  const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/450),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(f);else el.textContent=fmt(to);})(t0);
}

const lg=v=>Math.log10(v),GMIN=lg(0.00002),GMAX=lg(0.55);

const gT=v=>Math.max(0,Math.min(1,(lg(v)-GMIN)/(GMAX-GMIN)));
const gCol=v=>{const t=gT(v),h=Math.round(142*(1-t));return `--c:hsl(${h},74%,${40+Math.round(4*t)}%);--c2:hsl(${Math.min(150,h+22)},82%,58%)`;};

async function readXlsx(file){

  const sst=z['xl/sharedStrings.xml']?gn(P(dec.decode(z['xl/sharedStrings.xml'])),'si').map(si=>gn(si,'t').map(t=>t.textContent).join('')):[];
  const wb=P(dec.decode(z['xl/workbook.xml'])),rels=z['xl/_rels/workbook.xml.rels']?P(dec.decode(z['xl/_rels/workbook.xml.rels'])):null;
  const sheets=gn(wb,'sheet').map(s=>{const rid=s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||s.getAttribute('r:id');
    const rel=rels?gn(rels,'Relationship').find(r=>r.getAttribute('Id')===rid):null;let t=rel?rel.getAttribute('Target'):'';t=t.replace(/^\//,'');if(t&&!t.startsWith('xl/'))t='xl/'+t;return {name:s.getAttribute('name'),path:t};});
  const load=sh=>{const out={};if(!sh||!z[sh.path])return out;gn(P(dec.decode(z[sh.path])),'c').forEach(c=>{const ref=c.getAttribute('r'),m=/^([A-Z]+)(\d+)$/.exec(ref);if(!m)return;
    let ci=0;for(const ch of m[1])ci=ci*26+ch.charCodeAt(0)-64;ci--;const ri=+m[2]-1,t=c.getAttribute('t');let v=null;
    if(t==='inlineStr')v=gn(c,'t').map(x=>x.textContent).join('');else{const ve=gn(c,'v')[0];if(ve){v=ve.textContent;if(t==='s')v=sst[+v]||'';else if(t!=='str'&&t!=='b'&&t!=='e'&&v!==''&&!isNaN(+v))v=+v;}}
    if(v!==null&&v!=='')out[ri+','+ci]=v;});return out;};
  const sh=n=>sheets.find(s=>s.name===n);

  if(!Object.keys(b).length&&!Object.keys(a).length)throw new Error('empty');
  const hdr={job:'',dept:'',place:'',worker:'',writer:'',sup:''};
  for(let r=0;r<20;r++){const l=String(a[r+',0']||'').replace(/\s/g,'');HDR_LAB.forEach(([k,lab])=>{if(l&&lab.replace(/\s/g,'').startsWith(l.slice(0,3))&&a[r+',1']!=null&&!hdr[k]&&l.length>=2&&r>0&&r<8)hdr[k]=String(a[r+',1']).trim();});}
  const steps=[],warns=[];let maxR=0;Object.keys(b).forEach(k=>{maxR=Math.max(maxR,+k.split(',')[0]);});

    const blk=ovSet(st.gtt),rm=[];
    Object.entries(epcRaw).forEach(([n,v])=>{n=+n;if(!st.gtt){warns.push(`${no}단계: GTT가 없어 EPC ${n}은(는) 건너뛰었습니다.`);return;}

/* ---------- 평가 결과 요약 그래픽: 반원 게이지 + 7단계 등급 막대 (PDF·화면은 SVG, Word·PPT는 같은 그림을 PNG로 넣음) ---------- */
const GRADE_CUT=[.6,.3,.1,.03,.01,.001];   // 7·6·5·4·3·2등급의 하한 (1등급은 0.1% 미만)
const GRADE_LAB=['60% 이상','30~60%','10~30%','3~10%','1~3%','0.1~1%','0.1% 미만'];
const GRADE_COL=['#c1272d','#e2701c','#f6b800','#fff27a','#cddca7','#79b942','#16974b'],GRADE_TXT=['#fff','#fff','#3a2a00','#4a4300','#33401a','#fff','#fff'];
const gradeOf=th=>{if(th==null)return 0;for(let i=0;i<GRADE_CUT.length;i++)if(th>=GRADE_CUT[i])return 7-i;return 1;};
function SUMSVG(M){
  const th=M.th,W=714,Hh=252,FF="Pretendard,'Malgun Gothic','Noto Sans KR',sans-serif",cx=178,cy=212,R1=152,R0=116,Rm=(R0+R1)/2;
  const P=(a,r)=>[cx+r*Math.cos(a*Math.PI/180),cy-r*Math.sin(a*Math.PI/180)];
  const f=n=>n.toFixed(1);
  const sector=(a0,a1,c)=>{const [x0,y0]=P(a0,R1),[x1,y1]=P(a1,R1),[x2,y2]=P(a1,R0),[x3,y3]=P(a0,R0);return `<path d="M${f(x0)} ${f(y0)} A${R1} ${R1} 0 0 1 ${f(x1)} ${f(y1)} L${f(x2)} ${f(y2)} A${R0} ${R0} 0 0 0 ${f(x3)} ${f(y3)} Z" fill="${c}"/>`;};
  const zl=(mid,t)=>{const [x,y]=P(mid,Rm);return `<text transform="translate(${f(x)} ${f(y)}) rotate(${f(90-mid)})" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="800" fill="#fff" letter-spacing="1">${t}<\/text>`;};
  const pos=th==null?null:Math.max(0,Math.min(1,(Math.log10(Math.max(th,1e-6))+3)/3)),ang=pos==null?null:pos*180;
  let ptr='';if(ang!=null){const [tx,ty]=P(ang,R1+3),[bx,by]=P(ang,R1+22),t=ang*Math.PI/180,dx=-Math.sin(t)*9,dy=-Math.cos(t)*9,[mx,my]=P(ang,Rm);
    ptr=`<polygon points="${f(tx)},${f(ty)} ${f(bx+dx)},${f(by+dy)} ${f(bx-dx)},${f(by-dy)}" fill="#1f2933"/><circle cx="${f(mx)}" cy="${f(my)}" r="8" fill="#fff" stroke="#1f2933" stroke-width="3.5"/>`;}
  const cut=(t,n)=>{t=String(t||'');return t.length>n?t.slice(0,n-1)+'…':t;};
  const mx=M.mxI,rows=[['가장 높은 단계',mx<0?'—':(mx+1)+'단계',mx<0?'':cut(S.steps[mx].name,24),'#1f2933'],['그 단계의 HEP',mx<0?'—':pct(M.rs[mx].hep),mx<0?'':'HEP '+fmt(M.rs[mx].hep),'#d9433a'],['단계 HEP 중앙값',M.med==null?'—':pct(M.med),M.med==null?'':'HEP '+fmt(M.med),'#1f2933']];
  const rx=404,rowsSvg=rows.map(([l,v,s,c],i)=>{const y=22+i*78;return `${i?`<line x1="${rx}" x2="${W}" y1="${y-6}" y2="${y-6}" stroke="#e1e5ea"/>`:''}<text x="${rx}" y="${y+12}" font-size="12.5" fill="#5b6572">${esc(l)}<\/text><text x="${rx}" y="${y+44}" font-size="30" font-weight="800" fill="${c}">${esc(v)}<\/text><text x="${rx}" y="${y+62}" font-size="11.5" fill="#6b7280">${esc(s)}<\/text>`;}).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" font-family="${FF}">`+
   `${sector(180,122,'#d9433a')}${sector(118,62,'#f6b800')}${sector(58,0,'#2e9e4f')}${zl(151,'높음')}${zl(90,'보통')}${zl(29,'낮음')}${ptr}`+
   `<text x="${cx}" y="${cy-22}" text-anchor="middle" font-size="42" font-weight="800" fill="#1f2933">${th==null?'—':esc(pct(th))}<\/text><text x="${cx}" y="${cy+2}" text-anchor="middle" font-size="13" fill="#5b6572">작업 전체 오류확률<\/text>`+
   `<text x="${f(P(180,Rm)[0])}" y="${cy+20}" text-anchor="middle" font-size="10.5" fill="#6b7280">100%<\/text><text x="${f(P(0,Rm)[0])}" y="${cy+20}" text-anchor="middle" font-size="10.5" fill="#6b7280">0.1%<\/text>`+
   `<line x1="${rx-18}" x2="${rx-18}" y1="14" y2="${cy}" stroke="#e1e5ea"/>${rowsSvg}`+
   `<text x="0" y="${Hh-6}" font-size="10" fill="#8a94a1">※ 게이지는 0.1%~100%를 로그 눈금으로 나타냅니다.<\/text><\/svg>`;
}

/* 단계별 HEP 등급 막대 (1~7등급, 단계마다 해당 칸에 화살표) */
function GRADESVG(hep){
  const W=714,Hh=86,FF="Pretendard,'Malgun Gothic','Noto Sans KR',sans-serif",g=gradeOf(hep),gap=5,bw=(W-6*gap)/7,by0=30,bh=28,f=n=>n.toFixed(1);
  const boxes=GRADE_COL.map((c,i)=>{const gr=7-i,x=i*(bw+gap),on=gr===g;return `<rect x="${f(x)}" y="${by0}" width="${f(bw)}" height="${bh}" rx="4" fill="${c}"${on?' stroke="#1f2933" stroke-width="3"':''}/><text x="${f(x+bw/2)}" y="${by0+bh/2+1}" text-anchor="middle" dominant-baseline="central" font-size="${on?20:16}" font-weight="800" fill="${GRADE_TXT[i]}">${gr}<\/text><text x="${f(x+bw/2)}" y="${by0+bh+13}" text-anchor="middle" font-size="9.5" fill="#6b7280">${GRADE_LAB[i]}<\/text>`;}).join('');
  let gm='';if(g){const i=7-g,x=i*(bw+gap)+bw/2,a=x<70?'start':x>W-70?'end':'middle',tx=a==='start'?x-12:a==='end'?x+12:x;gm=`<polygon points="${f(x)},${by0-3} ${f(x-8)},${by0-15} ${f(x+8)},${by0-15}" fill="#1f2933"/><text x="${f(tx)}" y="${by0-20}" text-anchor="${a}" font-size="12.5" font-weight="800" fill="#1f2933">HEP 등급 ${g}<\/text>`;}
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" font-family="${FF}">${gm}${boxes}<\/svg>`;
}
let SUMIMG=null;
function sumPng(){return new Promise((ok,no)=>{try{const svg=SUMSVG(model()),im=new Image(),sc=2;
  im.onload=()=>{const c=document.createElement('canvas');c.width=714*sc;c.height=252*sc;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    const b=atob(c.toDataURL('image/png').split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);SUMIMG={bytes:u,w:714,h:252};ok(SUMIMG);};
  im.onerror=()=>no(new Error('요약 그래픽을 그리지 못했습니다'));im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);}catch(e){no(e);}});}

/* ---------- 내용 블록 (PDF는 이 블록을 쪽 높이에 맞게 직접 나눠 담습니다) ---------- */
function repBlocks(){
  const r=RP(),M=model(),H=S.hdr,out=[],sec=(n,t)=>({n,t}),mxv=Math.max(.0001,...M.rs.map(x=>x.hep||0));
  const add=(s,html,first)=>out.push({sec:s,html,first:!!first});
  const S1=sec('I','평가 개요'),S2=sec('II','총평'),S3=sec('III','단계별 산정 근거'),S4=sec('IV','해석 유의사항');
  const kv=(k,v)=>`<th>${k}<\/th><td>${esc(v||'')}<\/td>`;
  add(S1,`<div class="h3">평가 정보<\/div><table class="t k4"><tr>${kv('작업명',H.job)}${kv('부서',H.dept)}<\/tr><tr>${kv('작업장소',H.place)}${kv('수행 작업자',H.worker)}<\/tr><tr>${kv('작성자',H.writer)}${kv('감독자',H.sup)}<\/tr><tr>${kv('작성일',today())}${kv('평가 단계 수',S.steps.length+'개 단계')}<\/tr><\/table>`,true);
  add(S1,`<div class="h3">평가 결과 요약<\/div><div class="sumv">${SUMSVG(M)}<\/div>`);
  add(S1,`<div class="h3">평가 방법<\/div><div class="p">HEART는 작업의 성격에 맞는 <b>기준 오류확률(GTT)<\/b>에, 오류를 유발하는 조건(<b>EPC<\/b>)이 얼마나 해당하는지(<b>APOA<\/b>)를 곱해 인간오류확률(HEP)을 구합니다.<\/div>
    <div class="fx">HEP = GTT 기준 오류확률 × Π [ (EPC 최대 배수 − 1) × APOA + 1 ] &nbsp;(최대 1)<\/div>
    <div class="p">작업 전체 오류확률은 단계가 서로 독립이라고 가정해 <b>1 − Π(1 − 단계 HEP)<\/b>로 구합니다. GTT 정의에 이미 포함된 EPC는 이중계상을 피하기 위해 선택에서 제외했습니다.<\/div>`);
  add(S2,`<div class="h3">총평<\/div><div class="sum">${esc(M.t1)}${M.t2?'<br><br>'+esc(M.t2):''}<\/div>${M.miss.length?`<div class="note">※ ${M.miss.join('·')}단계는 GTT가 선택되지 않아 계산에서 빠져 있습니다.<\/div>`:''}`,true);
  const sorted=M.sorted,rows=S.steps.map((s,i)=>{const x=M.rs[i],rk=sorted.findIndex(([,j])=>j===i)+1;
    return `<tr><td class="c">${i+1}<\/td><td>${esc(s.name||'(단계명 없음)')}<\/td><td class="c">${s.gtt||'—'}<\/td><td class="c">${x.nhep==null?'—':x.nhep}<\/td><td class="c"><b>${fmt(x.hep)}<\/b><br><span class="mu">${pct(x.hep)}<\/span><\/td><td><div class="bar"><i class="${i===M.mxI?'hi':''}" style="width:${x.hep?Math.max(3,x.hep/mxv*100):0}%"><\/i><\/div><\/td><td class="c">${rk||'—'}<\/td><\/tr>`;});
  for(let k=0;k<Math.max(1,rows.length);k+=12)add(S2,`${k===0?'<div class="h3">단계별 HEP<\/div>':'<div class="h3">단계별 HEP (계속)<\/div>'}<table class="t"><thead><tr><th style="width:42px">단계<\/th><th>단계명<\/th><th style="width:44px">GTT<\/th><th style="width:56px">기준값<\/th><th style="width:80px">HEP<\/th><th style="width:150px">상대 크기<\/th><th style="width:42px">순위<\/th><\/tr><\/thead><tbody>${rows.slice(k,k+12).join('')}<\/tbody><\/table>`);

      <div class="gsv">${GRADESVG(x.hep)}<\/div>
      ${x.terms.length?`<div class="imp"><b>개선 포인트<\/b> (곱해진 값이 큰 조건 순)<ul>${x.terms.slice(0,3).map(t=>`<li>EPC ${t.no} ${esc(EASY[t.no][0])} → ${esc(EPC[t.no][3])}<\/li>`).join('')}<\/ul><\/div>`:'<div class="mu">선택한 EPC 없음 — HEP는 GTT 기준값 그대로입니다.<\/div>'}
      ${x.pend?`<div class="note">해당 정도를 고르지 않은 EPC ${x.pend}개는 제외되었습니다.<\/div>`:''}`);});
  add(S4,`<div class="h3">해석할 때 유의할 점<\/div><ul class="bl"><li>HEP는 사고확률이 아니라 <b>인간오류가 일어날 확률의 추정값<\/b>입니다.<\/li><li>값은 GTT·EPC·APOA에 대한 평가자의 판단에 따라 달라지므로, 사전 자료와 현장 확인 근거를 함께 기록해 해석합니다.<\/li><li>단계 수가 많을수록 작업 전체 오류확률은 1에 가까워집니다. 단계 수가 다른 작업끼리 비교하는 지표로 쓰지 않습니다.<\/li><li>GTT 정의에 이미 포함된 EPC는 이중계상을 피하기 위해 제외했습니다.<\/li><\/ul>`,true);
  add(S4,`<div class="h3">GTT(작업 성격) 정의<\/div><table class="t"><thead><tr><th style="width:44px">GTT<\/th><th>작업 성격<\/th><th style="width:80px">기준 오류확률<\/th><\/tr><\/thead><tbody>${GTT_ORDER.map(k=>`<tr><td class="c"><b>${k}<\/b><\/td><td>${esc(GTT[k].d)}<\/td><td class="c">${GTT[k].v}<\/td><\/tr>`).join('')}<\/tbody><\/table>`);
  add(S4,`<div class="mu" style="margin-top:8px">${esc(REF_TXT)}<\/div>`);
  return out;
}

function printReport(){
  const r=RP(),blocks=repBlocks(),f=document.createElement('iframe');
  f.style.cssText='position:fixed;left:-9999px;top:0;width:900px;height:1200px;border:0';document.body.appendChild(f);
  const d=f.contentWindow.document;d.open();const T=(n,a)=>'<'+n+(a||'')+'>',C=n=>'<'+'/'+n+'>';
  d.write(T('!doctype',' html')+T('html',' lang="ko"')+T('head')+T('meta',' charset="utf-8"')+T('title')+'HEART 결과보고서'+C('title')+T('style')+PCSS(r)+C('style')+C('head')+T('body')+T('div',' id="m" style="position:absolute;left:-2000px;top:0;width:714px"')+blocks.map((b,i)=>T('div',' class="blk" data-i="'+i+'"')+b.html+C('div')).join('')+C('div')+C('body')+C('html'));d.close();
  setTimeout(()=>{try{
    const H=1123-96-52,m=d.getElementById('m'),hs=[...m.children].map(e=>e.offsetHeight+10),pages=[];let cur=null;
    blocks.forEach((b,i)=>{if(!cur||b.first||cur.sec!==b.sec||cur.h+hs[i]>H){cur={sec:b.sec,h:0,items:[],cont:cur&&cur.sec===b.sec&&!b.first};pages.push(cur);}cur.items.push(b.html);cur.h+=hs[i];});
    const N=pages.length+1+(r.back?1:0),dt='['+today()+']',lg=r.logo?`<img class="hl" src="${r.logo}">`:'';
    const pg=(p,i)=>`<div class="pg"><div class="hd"><div class="rm">${p.sec.n}<\/div><h1>${p.sec.t}${p.cont?' <small style="font-size:12px;color:#6b7280;font-weight:600">(계속)<\/small>':''}<\/h1>${lg}<\/div><div class="ct">${p.items.map(h=>`<div class="blk">${h}<\/div>`).join('')}<\/div><div class="ft"><span>${dt}<\/span><div style="display:flex;align-items:center"><span>© ${esc(r.pub||'HEART 인간오류확률 평가')} ALL RIGHTS RESERVED<\/span><div class="pn">${i+2}<\/div><\/div><\/div><\/div>`;
    d.body.innerHTML=`<div class="pg">${coverHtml(r)}<\/div>`+pages.map((p,i)=>pg({sec:p.sec,cont:p.cont,items:p.items},i)).join('')+(r.back?`<div class="pg">${backHtml(r)}<\/div>`:'');
    f.contentWindow.focus();f.contentWindow.print();
  }catch(e){toast('인쇄창을 열지 못했습니다: '+e.message);}setTimeout(()=>f.remove(),60000);},500);
}

  if(c('[data-addstep]')){S.steps.push(newStep());CUR=S.steps.length-1;FILTER='all';STG=1;save();renderSt(1);say('새 단계예요! 무슨 일을 하는 단계인지 적어 주세요.');return;}

  if((b=c('[data-stg]'))){goStage(+b.dataset.stg);return;}
  if((b=c('[data-g]'))){pickGtt(b.dataset.g,b,ev);return;}
  if(c('#bTemp')){tempSave();return;}
  if(c('#hmute')){HMUTE=!HMUTE;$('#hbub').classList.toggle('mute',HMUTE);toast(HMUTE?'도우미 말풍선을 껐습니다':'도우미 말풍선을 켰습니다');if(!HMUTE)helperCtx();return;}
  if(c('[data-next]')){FILTER='all';nextAction();return;}
  if((b=c('[data-flt]'))){FILTER=b.dataset.flt;applyFilter();return;}
  if((b=c('[data-pick]'))){const st=S.steps[CUR],n=+b.dataset.pick;if(!st.gtt){toast('GTT를 먼저 고르세요');return;}if(ovSet(st.gtt).has(n)){toast('GTT에 이미 포함된 조건입니다');return;}st.epc[n]=typeof st.epc[n]==='number'?st.epc[n]:null;save();refreshRow(n);drawTop3();drawLive();
    const rw=$('#er-'+n);if(rw){scrollToEl(rw,80);rw.classList.remove('glow');void rw.offsetWidth;rw.classList.add('glow');}say(`EPC ${n}을(를) 골랐어요. 얼마나 해당하는지 골라 주세요.`,'wink');return;}
  if(c('#bPrint')){printReport();return;}
  if(c('#bDocx')){sumPng().then(()=>dl('HEART_결과보고서.docx',docx())).catch(e=>toast('Word 파일을 만들지 못했습니다: '+e.message));return;}
  if(c('#bPptx')){sumPng().then(()=>dl('HEART_결과보고서.pptx',pptx())).catch(e=>toast('PPT 파일을 만들지 못했습니다: '+e.message));return;}
  if(c('#bCsv')){dl('HEART_결과.csv',csv(),'text/csv;charset=utf-8');return;}
  if(c('[data-xt]')){dl('HEART_작업단계_서식.xlsx',xlsx(false));toast('서식을 내려받았습니다. 엑셀에 입력한 뒤 [엑셀 업로드]를 누르세요');return;}
  if(c('[data-xs]')){dl('HEART_현재내용.xlsx',xlsx(true));return;}
  if(c('[data-xu]')){$('#fX').click();return;}
  if(c('[data-xclose]')){IMPMSG=null;renderSt();return;}
  if(c('#bSave')){dl('HEART_평가_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,1),'application/json');toast('파일로 저장했습니다');return;}
  if(c('#bLoad')){$('#fLoad').click();return;}
  if(c('#bNew')){if(!confirm('현재 입력을 모두 지우고 새로 시작할까요? (먼저 파일 저장을 권장합니다)'))return;S={hdr:{job:'',dept:'',place:'',worker:'',writer:'',sup:''},steps:[newStep()]};CUR=0;STG=1;save();show('ov');return;}
});
document.addEventListener('change',ev=>{
  const t=ev.target,d=t.dataset||{};
  if(t.id==='fX'){const f=t.files[0];if(!f)return;t.value='';
    readXlsx(f).then(r=>{S={hdr:r.hdr,steps:r.steps};CUR=0;FILTER='all';save();IMPMSG={n:r.steps.length,warns:r.warns};show('st');}).catch(e=>toast(e&&(e.message==='nostep'||e.message==='empty')?'엑셀에 입력된 단계가 없습니다. "작업단계" 시트에 단계명·작업 내용·GTT를 적고 저장한 뒤 올려 주세요':'엑셀을 읽지 못했습니다. 이 프로그램의 서식(.xlsx)인지 확인하세요'));return;}
  if(t.id==='fLoad'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.steps||!j.hdr)throw 0;S=j;CUR=0;save();show('ov');toast('불러왔습니다');}catch(e){toast('이 프로그램에서 저장한 파일이 아닙니다');}};r.readAsText(f);t.value='';return;}
  const st=S.steps[CUR];
  if(d.ec){const n=+d.ec;if(t.checked){if(!st.gtt||ovSet(st.gtt).has(n)){t.checked=false;return;}st.epc[n]=typeof st.epc[n]==='number'?st.epc[n]:null;}else delete st.epc[n];save();refreshRow(n);drawTop3();drawLive();
    if(t.checked){const s=document.querySelector(`[data-ea="${n}"]`);if(s)s.focus();say('얼마나 해당하는지(0~100%) 골라 주세요.','think');}return;}
  if(d.ea){const n=+d.ea;if(n in st.epc){st.epc[n]=t.value===''?null:+t.value;save();refreshRow(n);drawLive();helperCtx();}return;}
});
let tm=null;
document.addEventListener('input',ev=>{
  const t=ev.target,d=t.dataset||{};
  if(d.h){S.hdr[d.h]=t.value;save();return;}
  const st=S.steps[CUR];if(!st)return;
  if(d.sn){st.name=t.value;save();clearTimeout(tm);tm=setTimeout(drawCues,300);const tb=document.querySelectorAll('.stabs .t')[CUR];if(tb)tb.textContent=(CUR+1)+'. '+(st.name||'(단계명 없음)');return;}
  if(d.sd){st.desc=t.value;save();clearTimeout(tm);tm=setTimeout(drawCues,300);return;}
});
load();show('ov');
if(LOADED){const d=new Date(LOADED);$('#tmpT').textContent='불러옴 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');DIRTY=false;setTimeout(()=>say('지난번 임시저장 내용을 불러왔어요!','happy'),400);}
stick(true);setTimeout(()=>stick(true),600);
</script>
</body></html>
